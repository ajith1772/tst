<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>SCREEN TO SEEN — Tablet Speaker Teleprompter &amp; Stage Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', '"Noto Sans Malayalam"', 'sans-serif'],
            ml: ['"Noto Sans Malayalam"', '"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', 'Inter', 'Noto Sans Malayalam', sans-serif;
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
    }

    /* Hide scrollbar for clean horizontal tablet pill bar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Dynamic Font Size Scale Classes for Arm's-Length Tablet Reading */
    body.font-scale-sm { --script-size: 1rem; --script-lh: 1.7; --meta-size: 0.875rem; }
    body.font-scale-md { --script-size: 1.18rem; --script-lh: 1.82; --meta-size: 0.95rem; }
    body.font-scale-lg { --script-size: 1.38rem; --script-lh: 1.9; --meta-size: 1.05rem; }
    body.font-scale-xl { --script-size: 1.62rem; --script-lh: 1.95; --meta-size: 1.15rem; }

    .teleprompter-script {
      font-size: var(--script-size, 1.18rem);
      line-height: var(--script-lh, 1.82);
    }
    .teleprompter-meta {
      font-size: var(--meta-size, 0.95rem);
      line-height: 1.65;
    }

    /* Subtle Minimalist Card & Elevation */
    .studio-card {
      background-color: #ffffff;
      border: 1.5px solid #e2e8f0;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.03);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.25s ease;
    }
    .studio-card.completed-seg {
      border-color: #a7f3d0;
      background-color: #f8fafc;
    }

    /* Highlight search matches */
    mark.search-hl {
      background-color: #fef08a;
      color: #0f172a;
      padding: 0 3px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* ==================== INLINE PRONUNCIATION VOICE-OVER (COMPLICATED WORDS ONLY) ==================== */
    .pron-word {
      display: inline;
      padding: 0 4px 1px 4px;
      margin: 0 1px;
      border: none;
      border-radius: 6px;
      background-color: #eef2ff;
      border-bottom: 2px dotted #6366f1;
      color: #1e1b4b;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      text-align: left;
    }
    .pron-word:hover {
      background-color: #dbeafe;
      color: #1d4ed8;
    }
    .pron-word.pron-speaking {
      background-color: #2563eb;
      color: #ffffff;
      border-bottom-color: #1e40af;
    }
    .pron-word .pron-icon {
      display: inline-block;
      font-size: 0.76em;
      margin-left: 3px;
      vertical-align: baseline;
      opacity: 0.85;
    }

    /* ==================== AUTO-HIDE HEADER & FOOTER ==================== */
    #stageHeader, #stageFooter {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
    }

    body.header-autohide #stageHeader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      transform: translateY(-105%);
    }
    body.header-autohide #stageHeader.reveal-bar {
      transform: translateY(0);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.14);
    }

    body.footer-autohide #stageFooter {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      transform: translateY(105%);
    }
    body.footer-autohide #stageFooter.reveal-bar {
      transform: translateY(0);
      box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.12);
    }

    /* Edge Hover / Touch Trigger Zones */
    #topHoverZone, #bottomHoverZone {
      display: none;
    }
    body.header-autohide #topHoverZone {
      display: flex;
    }
    body.footer-autohide #bottomHoverZone {
      display: flex;
    }

    /* 100% Full-Width Single-Page Split Layout (Expands Automatically When Bars Hide) */
    @media (min-width: 1024px) {
      .single-page-split {
        height: calc(100vh - var(--bars-offset, 195px));
        min-height: 500px;
      }
      body.header-autohide:not(.footer-autohide) { --bars-offset: 92px; }
      body.footer-autohide:not(.header-autohide) { --bars-offset: 138px; }
      body.header-autohide.footer-autohide { --bars-offset: 28px; }
      .split-pane {
        height: 100%;
        overflow-y: auto;
      }
    }

    /* Clean subtle scrollbars for split panes */
    .split-pane::-webkit-scrollbar {
      width: 6px;
    }
    .split-pane::-webkit-scrollbar-track {
      background: #f8fafc;
      border-radius: 9999px;
    }
    .split-pane::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .split-pane::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; }
      .studio-card { break-inside: avoid; border: 1px solid #cbd5e1; box-shadow: none; }
      .single-page-split, .split-pane { height: auto !important; overflow: visible !important; }
      .pron-word {
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        color: inherit !important;
      }
      .pron-word .pron-icon { display: none !important; }
    }
  </style>
</head>
<body class="font-scale-md bg-white text-slate-900 min-h-screen flex flex-col">

  <!-- ==================== TOP EDGE MOUSE / TOUCH REVEAL TRIGGER ==================== -->
  <div id="topHoverZone"
       onmouseenter="revealHeader()"
       ontouchstart="revealHeader()"
       onclick="revealHeader()"
       class="no-print fixed top-0 left-0 right-0 h-6 z-[45] items-start justify-center cursor-pointer select-none group">
    <div class="px-4 py-0.5 rounded-b-xl bg-slate-900/75 group-hover:bg-blue-600 text-white text-[11px] font-bold tracking-wide shadow-md backdrop-blur-sm transition">
      ⌄ Touch / Hover for Header
    </div>
  </div>

  <!-- ==================== STICKY / AUTO-HIDE TOP STAGE CONTROL BAR ==================== -->
  <header id="stageHeader"
          onmouseenter="keepHeaderOpen()"
          onmouseleave="scheduleHideHeader()"
          class="no-print sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <!-- Top Progress Line -->
    <div class="w-full h-1.5 bg-slate-100">
      <div id="completionProgressBar" class="h-full bg-gradient-to-r from-blue-600 to-emerald-600 transition-all duration-300" style="width: 0%;"></div>
    </div>

    <div class="w-full max-w-none mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2.5">
      <!-- Brand + Progress -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-50 border border-blue-200 text-blue-700 font-black text-sm flex items-center justify-center shrink-0">
          S2S
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-sm sm:text-base font-black tracking-tight text-slate-900 uppercase">SCREEN TO SEEN</h1>
            <span id="completedCountBadge" class="px-2 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] font-bold">
              0 / 13 Done
            </span>
          </div>
          <p class="text-[11px] sm:text-xs text-slate-500 font-medium">Tablet Stage Teleprompter • 45 Min • 25 Slides • Tap 🔊 words or paste below</p>
        </div>
      </div>

      <!-- Live 45:00 Stage Timer Console -->
      <div class="flex items-center gap-1.5 sm:gap-2 bg-slate-50 border border-slate-200 rounded-2xl px-3 py-1.5">
        <div class="text-right pr-1">
          <div id="timerModeLabel" class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Remaining</div>
          <div id="stageTimerDisplay" class="font-mono text-lg sm:text-xl font-black text-slate-900 leading-none">45:00</div>
        </div>
        <button id="timerToggleBtn" onclick="toggleStageTimer()" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs sm:text-sm font-bold shadow-sm transition">
          ▶ Start
        </button>
        <button onclick="switchTimerDirection()" title="Switch Countdown (45:00) / Elapsed (00:00)" class="p-2 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold" aria-label="Switch Timer Mode">
          ⇅
        </button>
        <button onclick="resetStageTimer()" title="Reset Timer" class="p-2 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold" aria-label="Reset Timer">
          ↺
        </button>
      </div>

      <!-- Tablet Ergonomics: Font Scale, View Mode, Auto-Hide Bars, Fullscreen, Wake Lock -->
      <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
        <!-- Font Scaler -->
        <div class="inline-flex items-center bg-slate-50 border border-slate-200 rounded-xl p-0.5" role="group" aria-label="Text Size">
          <button onclick="setFontScale('sm')" id="fontBtn-sm" class="font-scale-btn px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">A-</button>
          <button onclick="setFontScale('md')" id="fontBtn-md" class="font-scale-btn px-2.5 py-1.5 rounded-lg text-xs font-black bg-white text-blue-700 shadow-sm border border-slate-200">A</button>
          <button onclick="setFontScale('lg')" id="fontBtn-lg" class="font-scale-btn px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">A+</button>
          <button onclick="setFontScale('xl')" id="fontBtn-xl" class="font-scale-btn px-2.5 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">A++</button>
        </div>

        <!-- Focus Mode vs All Scroll Toggle -->
        <button id="viewModeBtn" onclick="toggleViewMode()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-800 text-xs font-bold transition">
          📜 Show All 13
        </button>

        <!-- Auto-Hide Header Toggle -->
        <button id="autoHideHeaderBtn" onclick="toggleAutoHideHeader()" title="Hide header and show on mouse hover or touch" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs font-bold transition">
          ⬆ Hide Top
        </button>

        <!-- Auto-Hide Footer (Prev/Next) Toggle -->
        <button id="autoHideFooterBtn" onclick="toggleAutoHideFooter()" title="Hide Previous/Next bar and show on mouse hover or touch" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs font-bold transition">
          ⬇ Hide Nav
        </button>

        <!-- Full Screen Toggle -->
        <button id="fullscreenBtn" onclick="toggleFullScreen()" title="Toggle Full Screen Mode" class="px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow-sm transition">
          ⛶ Fullscreen
        </button>

        <!-- Screen Wake Lock Toggle -->
        <button id="wakeLockBtn" onclick="toggleWakeLock()" title="Keep Tablet Screen Awake on Stage" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-xs font-bold transition">
          ☀️ Awake: OFF
        </button>
      </div>
    </div>

    <!-- Secondary Filter, Instant Pronunciation & Navigation Bar -->
    <div class="border-t border-slate-100 bg-slate-50/70">
      <div class="w-full max-w-none mx-auto px-3 sm:px-6 py-2 flex flex-col xl:flex-row xl:items-center gap-2">
        <!-- Search, Slide Jump & Instant Paste-to-Pronounce Section -->
        <div class="flex flex-wrap items-center gap-2 shrink-0">
          <!-- Search Script -->
          <div class="relative flex-1 sm:flex-none sm:w-44">
            <input id="scriptSearchInput" type="search" oninput="handleSearchInput()" placeholder="🔍 Search script..." class="w-full px-3 py-1.5 rounded-xl bg-white border border-slate-300 text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-blue-600" />
          </div>

          <!-- Jump to Slide -->
          <select id="slideJumpSelect" onchange="jumpToSlide(this.value)" class="px-2.5 py-1.5 rounded-xl bg-white border border-slate-300 text-xs sm:text-sm font-bold text-blue-700 focus:outline-none focus:border-blue-600">
            <option value="">🎞️ Slide (1–25)</option>
          </select>

          <!-- Instant Pronunciation Box (Paste Word -> Auto Pronounce) -->
          <div class="flex items-center gap-1 bg-indigo-50/90 border border-indigo-200 rounded-xl p-1 flex-1 sm:flex-none">
            <input id="instantPronInput"
                   type="text"
                   onpaste="handleInstantPronPaste()"
                   onkeydown="if(event.key === 'Enter'){ event.preventDefault(); speakPastedWord(false); }"
                   placeholder="🔊 Paste word for instant pronunciation..."
                   class="w-full sm:w-56 px-2.5 py-1 rounded-lg bg-white border border-indigo-200 text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-600"
                   aria-label="Paste word for instant pronunciation" />
            <button id="instantPronSpeakBtn" type="button" onclick="speakPastedWord(false)" title="Pronounce Now (Normal Speed)" class="px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs font-bold transition whitespace-nowrap">
              🔊 Speak
            </button>
            <button type="button" onclick="speakPastedWord(true)" title="Pronounce Slowly (0.6x Speed)" class="px-2 py-1 rounded-lg bg-white hover:bg-indigo-100 border border-indigo-200 text-indigo-700 text-xs font-bold transition" aria-label="Speak Slowly">
              🐢
            </button>
            <button type="button" onclick="clearInstantPron()" title="Clear &amp; Stop Voice" class="px-1.5 py-1 rounded-lg bg-white hover:bg-rose-50 border border-indigo-200 text-slate-500 hover:text-rose-600 text-xs font-bold transition" aria-label="Clear Pronunciation Input">
              ✕
            </button>
          </div>
        </div>

        <!-- Horizontal Touch-Scrollable Segment Pill Tabs -->
        <nav id="segmentPillsNav" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 flex-1" aria-label="Segments">
          <!-- Populated dynamically -->
        </nav>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN TELEPROMPTER CONTENT AREA (100% WIDTH) ==================== -->
  <main id="mainStageArea" onclick="dismissRevealedBarsOnTap()" class="flex-1 w-full max-w-none mx-auto px-3 sm:px-5 py-3 sm:py-4">
    <!-- Status & Pronunciation Toast -->
    <div id="toastBanner" class="hidden fixed bottom-24 right-5 z-[60] max-w-md px-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs sm:text-sm font-bold shadow-xl font-ml"></div>

    <!-- Segments Container -->
    <div id="segmentsContainer" class="w-full space-y-6">
      <!-- Populated dynamically with single-page 2-column split segments -->
    </div>
  </main>

  <!-- ==================== BOTTOM EDGE MOUSE / TOUCH REVEAL TRIGGER ==================== -->
  <div id="bottomHoverZone"
       onmouseenter="revealFooter()"
       ontouchstart="revealFooter()"
       onclick="revealFooter()"
       class="no-print fixed bottom-0 left-0 right-0 h-6 z-[45] items-end justify-center cursor-pointer select-none group">
    <div class="px-4 py-0.5 rounded-t-xl bg-slate-900/75 group-hover:bg-blue-600 text-white text-[11px] font-bold tracking-wide shadow-md backdrop-blur-sm transition">
      ⌃ Touch / Hover for Prev / Next
    </div>
  </div>

  <!-- ==================== STICKY / AUTO-HIDE BOTTOM TOUCH NAVIGATION BAR ==================== -->
  <footer id="stageFooter"
          onmouseenter="keepFooterOpen()"
          onmouseleave="scheduleHideFooter()"
          class="no-print sticky bottom-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-sm">
    <div class="w-full max-w-none mx-auto px-3 sm:px-6 py-3 flex items-center justify-between gap-3">
      <button id="prevSegBtn" onclick="navigateSegment(-1)" class="px-4 sm:px-6 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 active:scale-95 disabled:opacity-40 disabled:pointer-events-none border border-slate-300 text-slate-900 font-extrabold text-xs sm:text-sm flex items-center gap-2 transition">
        <span>←</span>
        <span>Previous Segment</span>
      </button>

      <div class="flex items-center gap-3 text-center">
        <div>
          <div id="activeSegIndicator" class="text-xs sm:text-sm font-black text-blue-700">Segment 1 of 13</div>
          <div id="activeTimeIndicator" class="text-[11px] text-slate-500 font-semibold">00:00 – 02:30 Min • Slides 1–2</div>
        </div>
        <button id="footerSelfToggleBtn" onclick="toggleAutoHideFooter()" title="Toggle Auto-Hide for Bottom Bar" class="hidden sm:inline-flex items-center px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 text-[11px] font-bold transition">
          ⬇ Auto-Hide
        </button>
      </div>

      <button id="nextSegBtn" onclick="navigateSegment(1)" class="px-5 sm:px-7 py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 active:scale-95 disabled:opacity-40 disabled:pointer-events-none text-white font-extrabold text-xs sm:text-sm flex items-center gap-2 shadow-sm transition">
        <span>Next Segment</span>
        <span>→</span>
      </button>
    </div>
  </footer>

  <script>
    // ==================== PRONUNCIATION DICTIONARY (COMPLICATED / TRICKY WORDS ONLY) ====================
    // Each entry attaches an inline clickable 🔊 voice-over button ONLY to these concerned words.
    const PRONUNCIATION_WORDS = [
      { term: "Susan Wojcicki", speakAs: "Susan Wo-jit-skee", phonetic: "SOO-zun woh-JIT-skee", mlHint: "സൂസൻ വൊജിറ്റ്സ്കി" },
      { term: "Justin Rosenstein", speakAs: "Justin Ro-zen-stine", phonetic: "JUS-tin ROH-zen-styn", mlHint: "ജസ്റ്റിൻ റോസൻസ്റ്റൈൻ" },
      { term: "Daniel Kahneman", speakAs: "Daniel Kah-nuh-man", phonetic: "DAN-yul KAH-nuh-mun", mlHint: "ഡാനിയൽ കാനമൻ" },

      { term: "Behavioral Engineering", speakAs: "Behavioral Engineering", phonetic: "bi-HAYV-yur-ul en-jih-NEER-ing", mlHint: "ബിഹേവിയറൽ എഞ്ചിനീയറിംഗ്" },

      { term: "Cognitive Capacity", speakAs: "Cognitive Capacity", phonetic: "KOG-nih-tiv kuh-PAS-ih-tee", mlHint: "കോഗ്നിറ്റീവ് കപ്പാസിറ്റി" },
      { term: "Economic Exploitation", speakAs: "Economic Exploitation", phonetic: "ek-uh-NOM-ik ek-sploy-TAY-shun", mlHint: "എക്കണോമിക് എക്സ്പ്ലോയിറ്റേഷൻ" },
      { term: "Validation Addiction", speakAs: "Validation Addiction", phonetic: "val-ih-DAY-shun uh-DIK-shun", mlHint: "വാലിഡേഷൻ അഡിക്ഷൻ" },
      { term: "Unstated Assumptions", speakAs: "Unstated Assumptions", phonetic: "un-STAY-tid uh-SUMP-shunz", mlHint: "അൺസ്റ്റേറ്റഡ് അസംപ്ഷൻസ്" },
      { term: "Attention Residue", speakAs: "Attention Residue", phonetic: "uh-TEN-shun REZ-ih-dyoo", mlHint: "അറ്റൻഷൻ റെസിഡ്യൂ" },
      { term: "AI Hallucination", speakAs: "A I Hallucination", phonetic: "ay-eye huh-loo-sih-NAY-shun", mlHint: "എ.ഐ ഹാലൂസിനേഷൻ" },
      { term: "Hallucination", speakAs: "Hallucination", phonetic: "huh-loo-sih-NAY-shun", mlHint: "ഹാലൂസിനേഷൻ" },

    function loadPreferredVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices() || [];
      cachedEnglishVoice =
        voices.find(v => /Google US English/i.test(v.name)) ||
        voices.find(v => v.lang === 'en-IN') ||
        voices.find(v => v.lang === 'en-US') ||
        voices.find(v => v.lang === 'en-GB') ||
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) ||
        null;
      cachedMalayalamVoice =
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ml')) ||
        null;
    }
    if ('speechSynthesis' in window) {
      loadPreferredVoice();
      window.speechSynthesis.onvoiceschanged = loadPreferredVoice;
    }

    function speakWord(lowerKey, btnEl) {
      const entry = PRON_LOOKUP[lowerKey];
      if (!entry) return;

      showToast(`🔊 ${entry.term}  •  ${entry.phonetic}  (${entry.mlHint})`, 4000);

      if (!('speechSynthesis' in window)) return;

      try {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.pron-word.pron-speaking').forEach(el => el.classList.remove('pron-speaking'));

        const utter = new SpeechSynthesisUtterance(entry.speakAs || entry.term);
        if (cachedEnglishVoice) utter.voice = cachedEnglishVoice;
        utter.lang = cachedEnglishVoice ? cachedEnglishVoice.lang : 'en-US';
        utter.rate = 0.85;
        utter.pitch = 1.0;

        if (btnEl) {
          btnEl.classList.add('pron-speaking');
          utter.onend = () => btnEl.classList.remove('pron-speaking');
          utter.onerror = () => btnEl.classList.remove('pron-speaking');
        }
        window.speechSynthesis.speak(utter);
      } catch (err) {
        // Phonetic toast is already visible as fallback
      }
    }

    function handleInstantPronPaste() {

    function speakPastedWord(isSlow = false) {
      const input = document.getElementById('instantPronInput');
      const speakBtn = document.getElementById('instantPronSpeakBtn');
      const rawText = (input.value || '').trim();

      if (!rawText) {
        showToast('Paste or type any word in the header box to hear instant pronunciation!');
        input.focus();
        return;
      }

      if (!('speechSynthesis' in window)) {
        showToast('Voice pronunciation is not supported on this browser.');
        return;
      }

      // Check if pasted word matches our tuned stage dictionary
      const dictEntry = PRON_LOOKUP[rawText.toLowerCase()];
      const textToSpeak = dictEntry ? (dictEntry.speakAs || dictEntry.term) : rawText;
      const isMalayalam = /[\u0D00-\u0D7F]/.test(rawText);

      if (dictEntry) {
        showToast(`🔊 ${dictEntry.term}  •  ${dictEntry.phonetic}  (${dictEntry.mlHint})${isSlow ? ' [Slow]' : ''}`, 4200);
      } else {
        showToast(`🔊 Pronouncing${isSlow ? ' (Slow)' : ''}: "${rawText}"`, 3500);
      }

      try {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.pron-word.pron-speaking').forEach(el => el.classList.remove('pron-speaking'));

        const utter = new SpeechSynthesisUtterance(textToSpeak);
        if (isMalayalam && cachedMalayalamVoice) {
          utter.voice = cachedMalayalamVoice;
          utter.lang = cachedMalayalamVoice.lang;
        } else if (isMalayalam) {
          utter.lang = 'ml-IN';
        } else {
          if (cachedEnglishVoice) utter.voice = cachedEnglishVoice;
          utter.lang = cachedEnglishVoice ? cachedEnglishVoice.lang : 'en-US';
        }

        utter.rate = isSlow ? 0.6 : 0.88;
        utter.pitch = 1.0;

        if (speakBtn) {
          speakBtn.textContent = '🔈 Playing...';
          utter.onend = () => { speakBtn.textContent = '🔊 Speak'; };
          utter.onerror = () => { speakBtn.textContent = '🔊 Speak'; };
        }
        window.speechSynthesis.speak(utter);
      } catch (err) {
        showToast('Could not play pronunciation audio.');
      }
    }

          (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT')) {
        return;

      headerHideTimer = setTimeout(() => {
        document.getElementById('stageHeader').classList.remove('reveal-bar');

    // ==================== FULL SCREEN TOGGLE ====================
    async function toggleFullScreen() {
      const docEl = document.documentElement;
      const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);

      try {
        if (!isFull) {
          if (docEl.requestFullscreen) {
            await docEl.requestFullscreen();
          } else if (docEl.webkitRequestFullscreen) {
            await docEl.webkitRequestFullscreen();
          } else {
            showToast('Full Screen not supported on this browser.');
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
          }
        }
      } catch (err) {
        showToast('Could not toggle Full Screen mode.');
      }
    }

    function syncFullscreenButton() {
      const btn = document.getElementById('fullscreenBtn');
      const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (isFull) {
        btn.textContent = '🗗 Exit Full';
        btn.classList.remove('bg-slate-900', 'hover:bg-slate-800');
        btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
      } else {
        btn.textContent = '⛶ Fullscreen';
        btn.classList.add('bg-slate-900', 'hover:bg-slate-800');
        btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');

    // ==================== TEXT FORMATTING: SEARCH HIGHLIGHT + INLINE VOICE-OVER ====================
    function escapeHtml(rawText) {
      return String(rawText)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function applySearchHighlight(escapedText) {
      if (!searchQuery) return escapedText;
      const safeRegex = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return escapedText.replace(safeRegex, '<mark class="search-hl">$1</mark>');
    }

    // Plain highlight (used inside <a> tags where nested <button> is invalid)
    function highlightText(rawText) {
      return applySearchHighlight(escapeHtml(rawText));
    }

    // Full teleprompter formatter: attaches clickable 🔊 voice-over ONLY to complicated words
    function formatWithPronunciation(rawText) {
      const escaped = escapeHtml(rawText);
      const tokens = [];

      const tokenized = escaped.replace(PRON_REGEX, (match, prefix, matchedTerm) => {
        const lowerKey = matchedTerm.toLowerCase();
        const entry = PRON_LOOKUP[lowerKey];
        if (!entry) return match;
        const idx = tokens.length;
        tokens.push({ matchedTerm, lowerKey, entry });
        return `${prefix}%%PRON_TOK_${idx}%%`;
      });

      let html = applySearchHighlight(tokenized);

      html = html.replace(/%%PRON_TOK_(\d+)%%/g, (_, idxStr) => {
        const { matchedTerm, lowerKey, entry } = tokens[parseInt(idxStr, 10)];
        const safeKey = lowerKey.replace(/'/g, "\\'");
        const safeTitle = `🔊 Hear pronunciation: ${entry.phonetic} (${entry.mlHint})`.replace(/"/g, '&quot;');
        const labelHtml = applySearchHighlight(matchedTerm);
        return `<button type="button" class="pron-word" onclick="event.stopPropagation(); speakWord('${safeKey}', this)" title="${safeTitle}" aria-label="Pronounce ${matchedTerm}">${labelHtml}<span class="pron-icon" aria-hidden="true">🔊</span></button>`;
      });

      return html;
    }

    // ==================== NAVIGATION & PROGRESS ====================
    function navigateSegment(delta) {
      const nextIdx = activeSegmentIndex + delta;
      if (nextIdx >= 0 && nextIdx < MASTER_SEGMENTS.length) {
        activeSegmentIndex = nextIdx;
        renderSegmentPills();
        if (isSingleFocusMode) {
          renderSegments();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          updateBottomBar();
          const el = document.getElementById(MASTER_SEGMENTS[activeSegmentIndex].id);
          if (el) {
            const headerOffset = autoHideHeader ? 16 : 122;
            const top = el.getBoundingClientRect().top + window.scrollY - headerOffset;
            window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
          }
        }
      }
    }

    function updateBottomBar() {
      const seg = MASTER_SEGMENTS[activeSegmentIndex];
      document.getElementById('activeSegIndicator').textContent = `Segment ${activeSegmentIndex + 1} of ${MASTER_SEGMENTS.length} (${seg.badge})`;
      document.getElementById('activeTimeIndicator').textContent = `${seg.time} • ${seg.slideLabel}`;
      document.getElementById('prevSegBtn').disabled = activeSegmentIndex === 0;
      document.getElementById('nextSegBtn').disabled = activeSegmentIndex === MASTER_SEGMENTS.length - 1;
    }

    function toggleSegmentDone(segId, idx) {
      if (completedSegments.has(segId)) {
        completedSegments.delete(segId);
      } else {
        completedSegments.add(segId);
        if (isSingleFocusMode && idx < MASTER_SEGMENTS.length - 1) {
          activeSegmentIndex = idx + 1;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }
      localStorage.setItem(STORAGE_KEY_DONE, JSON.stringify(Array.from(completedSegments)));
      updateProgressUI();
      renderSegmentPills();
      renderSegments();
    }

    function updateProgressUI() {
      const count = completedSegments.size;
      const total = MASTER_SEGMENTS.length;
      document.getElementById('completedCountBadge').textContent = `${count} / ${total} Done`;
      document.getElementById('completionProgressBar').style.width = `${(count / total) * 100}%`;
    }

    // ==================== SCROLL SPY IN CONTINUOUS MODE ====================
    window.addEventListener('scroll', () => {
      if (isSingleFocusMode || searchQuery) return;
      const triggerY = 180;
      let currentIdx = 0;
      MASTER_SEGMENTS.forEach((seg, idx) => {
        const el = document.getElementById(seg.id);
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top <= triggerY) {
            currentIdx = idx;
          }
        }
      });
      if (currentIdx !== activeSegmentIndex) {
        activeSegmentIndex = currentIdx;
        updateBottomBar();
        const activePill = document.getElementById(`pill-${MASTER_SEGMENTS[currentIdx].id}`);
        if (activePill) {
          activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      }
    }, { passive: true });

    // ==================== SEARCH FILTER ====================
    function handleSearchInput() {
      searchQuery = document.getElementById('scriptSearchInput').value.trim();
      renderSegments();
    }

    function clearSearch() {
      document.getElementById('scriptSearchInput').value = '';
      searchQuery = '';
      renderSegments();
    }

    // ==================== FONT SCALING ====================
    function setFontScale(scale) {
      document.body.classList.remove('font-scale-sm', 'font-scale-md', 'font-scale-lg', 'font-scale-xl');
      document.body.classList.add(`font-scale-${scale}`);
      localStorage.setItem(STORAGE_KEY_FONT, scale);

      document.querySelectorAll('.font-scale-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-blue-700', 'shadow-sm', 'border', 'border-slate-200', 'font-black');
        btn.classList.add('text-slate-600', 'font-bold');
      });
      const activeBtn = document.getElementById(`fontBtn-${scale}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'text-blue-700', 'shadow-sm', 'border', 'border-slate-200', 'font-black');
        activeBtn.classList.remove('text-slate-600', 'font-bold');
      }
    }

    // ==================== 45:00 STAGE TIMER ====================
    function formatTime(secs) {
      const absSecs = Math.abs(secs);
      const m = Math.floor(absSecs / 60).toString().padStart(2, '0');
      const s = (absSecs % 60).toString().padStart(2, '0');
      return `${secs < 0 ? '-' : ''}${m}:${s}`;
    }

    function renderTimerDisplay() {
      const display = document.getElementById('stageTimerDisplay');
      const label = document.getElementById('timerModeLabel');
      if (isCountdownMode) {
        const remaining = TOTAL_SESSION_SECONDS - elapsedSeconds;
        label.textContent = 'Remaining';
        display.textContent = formatTime(remaining);
        if (remaining <= 0) {
          display.className = 'font-mono text-lg sm:text-xl font-black text-rose-600 leading-none animate-pulse';
        } else if (remaining <= 300) {
          display.className = 'font-mono text-lg sm:text-xl font-black text-amber-600 leading-none';
        } else {
          display.className = 'font-mono text-lg sm:text-xl font-black text-slate-900 leading-none';
        }
      } else {
        label.textContent = 'Elapsed';
        display.textContent = formatTime(elapsedSeconds);
        display.className = 'font-mono text-lg sm:text-xl font-black text-blue-700 leading-none';
      }
    }

    function toggleStageTimer() {
      const btn = document.getElementById('timerToggleBtn');
      if (!isTimerRunning) {
        isTimerRunning = true;
        btn.textContent = '⏸ Pause';
        btn.classList.replace('bg-blue-600', 'bg-amber-600');
        btn.classList.replace('hover:bg-blue-700', 'hover:bg-amber-700');
        timerInterval = setInterval(() => {
          elapsedSeconds++;
          renderTimerDisplay();
        }, 1000);
      } else {
        isTimerRunning = false;
        clearInterval(timerInterval);
        btn.textContent = '▶ Resume';
        btn.classList.replace('bg-amber-600', 'bg-blue-600');
        btn.classList.replace('hover:bg-amber-700', 'hover:bg-blue-700');
      }
    }

    function switchTimerDirection() {
      isCountdownMode = !isCountdownMode;
      renderTimerDisplay();
    }

    function resetStageTimer() {
      isTimerRunning = false;
      clearInterval(timerInterval);
      elapsedSeconds = 0;
      const btn = document.getElementById('timerToggleBtn');
      btn.textContent = '▶ Start';
      btn.classList.remove('bg-amber-600', 'hover:bg-amber-700');
      btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
      renderTimerDisplay();
    }

    // ==================== SCREEN WAKE LOCK (KEEP TABLET AWAKE ON STAGE) ====================
    async function toggleWakeLock() {
      const btn = document.getElementById('wakeLockBtn');
      if (!('wakeLock' in navigator)) {
        showToast('Wake Lock not supported on this browser — set tablet sleep to 30 mins.');
        return;
      }
      try {
        if (!wakeLockSentinel) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          btn.textContent = '☀️ Awake: ON';
          btn.classList.remove('bg-slate-100', 'text-slate-700');
          btn.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-800');
          showToast('Screen Wake Lock Active — Tablet will stay awake on stage!');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
            btn.textContent = '☀️ Awake: OFF';
            btn.classList.add('bg-slate-100', 'text-slate-700');
            btn.classList.remove('bg-emerald-50', 'border-emerald-300', 'text-emerald-800');
          });
        } else {
          await wakeLockSentinel.release();
          wakeLockSentinel = null;
          showToast('Screen Wake Lock Released');
        }
      } catch (err) {
        showToast('Could not activate Wake Lock.');
      }
    }

    // ==================== TOAST HELPER ====================
    let toastTimeout = null;
    function showToast(msg, durationMs = 3000) {
      const el = document.getElementById('toastBanner');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => el.classList.add('hidden'), durationMs);
    }

    // Start App
    initApp();
  </script>
</body>
</html>
